name: pizza-process

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pizza-process-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
    ports:
      - "8081:8080"
    volumes:
      - pizzadata:/var/lib/postgresql/data

  ivy:
    build: .
    network_mode: service:postgres
    depends_on:
      - postgres

volumes:
  pizzadata:
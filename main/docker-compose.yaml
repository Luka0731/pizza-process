name: pizza-process

services:
  postgres:
    container_name: db
    image: postgres:16
    environment:
      POSTGRES_DB: pizza-process-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - pizzadata:/var/lib/postgresql/data

volumes:
  pizzadata:
<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:rcp="jakarta.faces.composite/components/domain/receipt"
>



  <div class="recive-the-payment-page" id="reciveThePaymentPage">

    <hdr:Header
      title="Receive the payment"
    />

    <rcp:Receipt order="#{reciveThePaymentBean.order}" totalLabel="To collect" onlyTotal="true" styleClass="narrow centered"/>

    <ftr:Footer>
      <p:commandButton
        id="paidButton"
        value="Customer paid"
        icon="pi pi-check"
        styleClass="button button--primary"
        process="@this"
        action="#{reciveThePaymentBean.close()}"
        update="form:pageContent form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

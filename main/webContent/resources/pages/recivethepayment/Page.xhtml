<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:rcp="jakarta.faces.composite/components/generic/receipt"
  xmlns:prf="jakarta.faces.composite/components/domain/profile"
  xmlns:dtc="jakarta.faces.composite/components/domain/detailscard"
  xmlns:odc="jakarta.faces.composite/components/domain/ordercard"
>
  <h:outputStylesheet name="pages/recivethepayment/Page.css"/>



  <div class="payment-page" id="paymentPage">

    <hdr:Header
      title="Receive the payment"
      subtitle="#{reciveThePaymentBean.paid ? 'The customer already paid online' : 'Collect the money at the door'}"
      showCart="false"
    >
      <f:facet name="actions">
        <prf:Profile showAccountLinks="false"/>
      </f:facet>
    </hdr:Header>

    <!-- until it is paid, the page asks every 10 seconds if the customer paid online -->
    <p:poll
      interval="10"
      listener="#{reciveThePaymentBean.refresh()}"
      process="@this"
      update="form:pageContent form:messages"
      rendered="#{not reciveThePaymentBean.paid}"
    />

    <div class="payment-page__cards">
      <dtc:DetailsCard
        customerProfile="#{reciveThePaymentBean.order.customerProfile}"
        editable="false"
        styleClass="payment-page__details"
      />

      <rcp:Receipt
        itemLabel="Pizzas"
        itemCount="#{reciveThePaymentBean.order.totalPizzasAmount}"
        total="#{reciveThePaymentBean.order.totalPrice}"
        totalLabel="#{reciveThePaymentBean.paid ? 'Paid' : 'To collect'}"
        styleClass="payment-page__receipt"
      />

      <div class="payment-page__hint card">
        <i class="pi #{reciveThePaymentBean.paid ? 'pi-check-circle' : 'pi-info-circle'} payment-page__hint-icon"></i>
        <span class="payment-page__hint-text">
          <h:outputText value="#{reciveThePaymentBean.paid ? 'The customer paid online, nothing to collect.' : 'The customer can also pay online, this page will show it.'}"/>
        </span>
      </div>
    </div>

    <!-- closing the dialog ends the worker process -->
    <ftr:Footer styleClass="payment-page__footer">
      <p:commandButton
        id="paidButton"
        value="#{reciveThePaymentBean.paid ? 'Done' : 'Paid in cash'}"
        icon="pi pi-check"
        styleClass="button button--primary"
        process="@this"
        action="#{reciveThePaymentBean.close()}"
        update="form:pageContent form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

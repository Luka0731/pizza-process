<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:prf="jakarta.faces.composite/components/domain/profile"
  xmlns:rcp="jakarta.faces.composite/components/domain/receipt"
  xmlns:dtc="jakarta.faces.composite/components/domain/detailscard"
>



  <div class="payment-page" id="paymentPage">

    <hdr:Header
      title="Receive the payment"
      subtitle="Let the customer pay on your payment device, then confirm it here"
    >
      <f:facet name="actions">
        <prf:Profile/>
      </f:facet>
    </hdr:Header>

    <div class="split">
      <div class="split__main">
        <dtc:DetailsCard customerProfile="#{reciveThePaymentBean.order.customerProfile}" editable="false"/>
      </div>
      <div class="split__side">
        <rcp:Receipt order="#{reciveThePaymentBean.order}" totalLabel="To collect"/>
      </div>
    </div>

    <!-- closing the dialog ends the worker process -->
    <ftr:Footer>
      <p:commandButton
        id="paidButton"
        value="Customer paid"
        icon="pi pi-check"
        styleClass="button button--primary"
        process="@this"
        action="#{reciveThePaymentBean.close()}"
        update="form:pageContent form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

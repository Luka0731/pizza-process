<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
>
  <h:outputScript name="resources/pages/eatthepizzadialog/Page.js" target="head"/>
  <h:outputStylesheet name="resources/pages/eatthepizzadialog/Page.css" target="head"/>



  <div class="eat-page" id="eatPage">

    <hdr:Header
      title="Enjoy your pizza!"
    />

    <!-- ordered pizzas -->
    <div class="eat-page__table" data-eat-sound="#{resource['resources/assets/audio/eat.mp3']}">
      <ui:repeat value="#{eatThePizzaDialogBean.pizzas}" var="pizza">
        <p:graphicImage value="#{imageBean.image}" cache="false" styleClass="eat-page__pizza" alt="#{pizza.name}" title="#{pizza.name}">
          <f:param name="imageId" value="#{pizza.image.id}"/>
        </p:graphicImage>
      </ui:repeat>
    </div>

    <!-- thanks message -->
    <div class="eat-page__thanks card">
      <i class="pi pi-heart-fill eat-page__thanks-icon"></i>
      <h2 class="eat-page__thanks-title">Thank you for supporting Babajabuka's Pizzeria!</h2>
      <p:commandButton
        id="doneButton"
        value="Done"
        icon="pi pi-check"
        styleClass="button button--primary"
        process="@this"
        action="#{eatThePizzaDialogBean.close()}"
      />
    </div>

  </div>
</ui:composition>

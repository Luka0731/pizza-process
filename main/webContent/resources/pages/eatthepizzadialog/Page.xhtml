<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:prf="jakarta.faces.composite/components/domain/profile"
>
  <h:outputStylesheet name="pages/eatthepizzadialog/Page.css"/>
  <h:outputScript name="pages/eatthepizzadialog/Page.js"/>



  <div class="eat-page" id="eatPage">

    <hdr:Header
      title="Buon appetito!"
      subtitle="Click every pizza to eat it"
      showCart="false"
    />

    <!-- Page.js spreads the pizzas over the table, a click eats one. when all are gone it calls eatThePizzaDone() -->
    <div class="eat-page__table">
      <ui:repeat value="#{eatThePizzaDialogBean.pizzas}" var="pizza">
        <p:graphicImage value="#{imageBean.image}" cache="false" styleClass="eat-page__pizza" alt="#{pizza.name}" title="#{pizza.name}">
          <f:param name="imageId" value="#{pizza.image.id}"/>
        </p:graphicImage>
      </ui:repeat>
    </div>

    <!-- closing the dialog ends the customer process -->
    <p:remoteCommand name="eatThePizzaDone" process="@this" action="#{eatThePizzaDialogBean.close()}"/>

  </div>
</ui:composition>

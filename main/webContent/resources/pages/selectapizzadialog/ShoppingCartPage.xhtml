<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:cic="jakarta.faces.composite/components/domain/itemcard"
  xmlns:rcp="jakarta.faces.composite/components/domain/receipt"
>



  <div class="shopping-cart-page" id="shoppingCartPage">

    <hdr:Header
      title="Your Cart"
    />

    <div class="split">
      <div class="split__main">
        <h:panelGroup layout="block" styleClass="stack" rendered="#{not selectAPizzaDialogBean.cartEmpty}">
          <ui:repeat value="#{selectAPizzaDialogBean.order.items}" var="item" varStatus="loop">
            <cic:ItemCard
              item="#{item}"
              index="#{loop.index}"
              removeAction="#{selectAPizzaDialogBean.removeFromCart(item)}"
              update="form:pageContent form:messages"
            />
          </ui:repeat>
        </h:panelGroup>
        <h:panelGroup layout="block" styleClass="empty-state" rendered="#{selectAPizzaDialogBean.cartEmpty}">
          <i class="pi pi-shopping-cart empty-state__icon"></i>
          <span class="empty-state__text">Your cart is empty. Add a pizza from the menu first.</span>
        </h:panelGroup>
      </div>
      <div class="split__side">
        <rcp:Receipt order="#{selectAPizzaDialogBean.order}"/>
      </div>
    </div>

    <ftr:Footer>
      <p:commandButton
        id="continueShoppingButton"
        value="Add more"
        icon="pi pi-arrow-left"
        styleClass="button button--ghost"
        process="@this"
        action="#{selectAPizzaDialogBean.goToMenuPage()}"
        update="form:pageContent form:messages"
      />
      <p:commandButton
        id="checkoutButton"
        value="Order these"
        icon="pi pi-check"
        styleClass="button button--primary"
        process="@this"
        disabled="#{selectAPizzaDialogBean.cartEmpty}"
        action="#{selectAPizzaDialogBean.close()}"
        update="form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

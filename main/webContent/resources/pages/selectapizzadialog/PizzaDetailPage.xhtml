<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:cb="jakarta.faces.composite/components/domain/cartbutton"
>
  <h:outputStylesheet name="resources/pages/selectapizzadialog/PizzaDetailPage.css"/>



  <div class="detail-page" id="detailPage">

    <hdr:Header
      title="#{selectAPizzaDialogBean.selectedPizza.name}"
    />

    <!-- loaded state -->
    <h:panelGroup layout="block" styleClass="detail-page__body" rendered="#{selectAPizzaDialogBean.pizzaSelected}">

      <div class="detail-page__media">
        <p:graphicImage value="#{imageBean.image}" cache="false" styleClass="detail-page__image" alt="#{selectAPizzaDialogBean.selectedPizza.name}">
          <f:param name="imageId" value="#{selectAPizzaDialogBean.selectedPizza.image.id}"/>
        </p:graphicImage>
      </div>

      <div class="detail-page__info">
        <p class="detail-page__description">
          <h:outputText value="#{selectAPizzaDialogBean.selectedPizza.description}"/>
        </p>

        <!-- the price follows the size, the size buttons only redraw this one element -->
        <div class="detail-page__price">
          <h:outputText id="selectedPrice" value="#{selectAPizzaDialogBean.selectedPrice}" styleClass="fx-scramble">
            <f:convertNumber type="currency" currencySymbol="CHF " minFractionDigits="2"/>
          </h:outputText>
        </div>

        <div class="field">
          <p:outputLabel for="sizeSelect" value="Size" styleClass="field__label"/>
          <p:selectOneButton id="sizeSelect" value="#{selectAPizzaDialogBean.selectedSize}" styleClass="field__input size-select">
            <f:selectItems value="#{selectAPizzaDialogBean.possiblePizzaSizes}" var="size" itemValue="#{size}" itemLabel="#{size.label} #{size.diameterCm} cm"/>
            <p:ajax event="change" global="false" process="@this" update="selectedPrice form:messages"/>
          </p:selectOneButton>
        </div>

        <div class="field">
          <p:outputLabel for="amountSpinner" value="Amount" styleClass="field__label"/>
          <p:spinner id="amountSpinner" value="#{selectAPizzaDialogBean.selectedAmount}" min="1" max="20" stepFactor="1" buttons="horizontal" styleClass="field__input amount-spinner"/>
        </div>
      </div>

    </h:panelGroup>

    <!-- empty state -->
    <h:panelGroup layout="block" styleClass="empty-state" rendered="#{not selectAPizzaDialogBean.pizzaSelected}">
      <i class="pi pi-question-circle empty-state__icon"></i>
      <span class="empty-state__text">No pizza selected. Go back to the menu and pick one.</span>
    </h:panelGroup>

    <ftr:Footer>
      <p:commandButton
        id="backButton"
        value="Back to menu"
        icon="pi pi-arrow-left"
        styleClass="button button--ghost"
        process="@this"
        action="#{selectAPizzaDialogBean.goToMenuPage()}"
        update="form:pageContent form:messages"
      />
      <p:commandButton
        id="addToCartButton"
        value="Add to cart"
        icon="pi pi-plus"
        styleClass="button button--primary"
        disabled="#{not selectAPizzaDialogBean.pizzaSelected}"
        action="#{selectAPizzaDialogBean.addToCart}"
        update="form:pageContent form:messages"
      />
      <cb:CartButton
        count="#{selectAPizzaDialogBean.cartItemCount}"
        action="#{selectAPizzaDialogBean.goToCartPage()}"
        update="form:pageContent form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

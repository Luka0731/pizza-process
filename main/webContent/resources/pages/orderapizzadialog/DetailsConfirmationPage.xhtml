<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:rcp="jakarta.faces.composite/components/domain/receipt"
  xmlns:prf="jakarta.faces.composite/components/domain/profile"
  xmlns:dtc="jakarta.faces.composite/components/domain/detailscard"
  xmlns:odc="jakarta.faces.composite/components/domain/ordercard"
>



  <div class="details-confirmation-page" id="detailsConfirmationPage">

    <hdr:Header
      title="Is everything right?"
    >
      <f:facet name="profile">
        <prf:Profile
          showAccountLinks="true"
          loginAction="#{orderAPizzaDialogBean.goToLoginPage()}"
          signupAction="#{orderAPizzaDialogBean.goToSignupPage()}"
          logoutAction="#{orderAPizzaDialogBean.logout()}"
          update="form:pageContent form:messages"
        />
      </f:facet>
    </hdr:Header>

    <div class="split">
      <div class="split__main">
        <dtc:DetailsCard
          customerProfile="#{orderAPizzaDialogBean.customerProfile}"
          editAction="#{orderAPizzaDialogBean.goToDetailsInputPage()}"
          update="form:pageContent form:messages"
        />
        <odc:OrderCard order="#{orderAPizzaDialogBean.order}"/>
      </div>
      <div class="split__side">
        <rcp:Receipt order="#{orderAPizzaDialogBean.order}"/>
      </div>
    </div>

    <ftr:Footer>
      <p:commandButton
        id="backButton"
        value="Back"
        icon="pi pi-arrow-left"
        styleClass="button button--ghost"
        process="@this"
        action="#{orderAPizzaDialogBean.goToDetailsInputPage()}"
        update="form:pageContent form:messages"
      />
      <p:commandButton
        id="placeOrderButton"
        value="Confirm purchase"
        icon="pi pi-check"
        styleClass="button button--primary"
        process="@this"
        action="#{orderAPizzaDialogBean.placeOrder()}"
        update="form:pageContent form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
>
  <h:outputStylesheet name="resources/pages/orderapizzadialog/FinishPage.css"/>



  <div class="finish-page" id="finishPage">

    <hdr:Header
      title="Thank you!"
    />

    <div class="finish-page__body card">
      <span class="finish-page__stamp" aria-hidden="true">Ordered</span>
      <h2 class="finish-page__title">Your pizza is on the list</h2>
      <p class="finish-page__text">
        <h:outputText value="We bring it to #{orderAPizzaDialogBean.customerProfile.street}, #{orderAPizzaDialogBean.customerProfile.postalCode} #{orderAPizzaDialogBean.customerProfile.city}."/>
      </p>
      <dl class="data-list finish-page__reference">
        <div class="data-list__row">
          <dt class="data-list__label">Order number</dt>
          <dd class="data-list__value"><h:outputText value="#{orderAPizzaDialogBean.order.id}"/></dd>
        </div>
      </dl>
    </div>

    <ftr:Footer>
      <p:commandButton
        id="doneButton"
        value="Done"
        icon="pi pi-check"
        styleClass="button button--primary"
        process="@this"
        action="#{orderAPizzaDialogBean.close()}"
      />
    </ftr:Footer>

  </div>
</ui:composition>

<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:tif="jakarta.faces.composite/components/generic/textinputfield"
>



  <div class="signup-page" id="signupPage">

    <hdr:Header
      title="Create an account"
    />

    <!--
      name and email are the same fields as on the details page, so whatever was typed in there is already filled in here.
      f:validateBean switches to the OnSignup group, so the extra signup rules of Credentials are checked too,
      as soon as a field is left: password length, allowed characters and if the username is still free (@AvailableUserName).
      the password repeat is checked by the AuthenticationService on sign up, the id "passwordRepeated" matches
      Credentials.isPasswordRepeated(), so the UserNotifier puts that message under the repeat field.
    -->
    <f:validateBean validationGroups="ch.frox.pizzaprocess.main.java.core.validation.validationgroup.OnSignup">
      <div class="input-grid card narrow centered">
        <tif:TextInputField
          id="fullName"
          label="Full name"
          value="#{orderAPizzaDialogBean.customerProfile.fullName}"
          autocomplete="name"
          styleClass="input-grid__item input-grid__item--wide"
        />
        <tif:TextInputField
          id="email"
          label="E-mail"
          type="email"
          value="#{orderAPizzaDialogBean.customerProfile.email}"
          autocomplete="email"
          styleClass="input-grid__item input-grid__item--wide"
        />
        <tif:TextInputField
          id="userName"
          label="Username"
          value="#{orderAPizzaDialogBean.credentials.userName}"
          autocomplete="username"
          styleClass="input-grid__item input-grid__item--wide"
        />
        <tif:TextInputField
          id="password"
          label="Password"
          type="password"
          value="#{orderAPizzaDialogBean.credentials.password}"
          autocomplete="new-password"
          styleClass="input-grid__item"
        />
        <tif:TextInputField
          id="passwordRepeated"
          label="Repeat password"
          type="password"
          value="#{orderAPizzaDialogBean.credentials.passwordRepeat}"
          autocomplete="new-password"
          styleClass="input-grid__item"
        />

        <p:commandButton
          id="signupButton"
          value="Sign up"
          icon="pi pi-user-plus"
          styleClass="button button--primary form-submit"
          action="#{orderAPizzaDialogBean.signUp()}"
          update="form:pageContent form:messages"
        />

        <div class="account-switch input-grid__item input-grid__item--wide">
          <span class="account-switch__text">Already have an account?</span>
          <p:commandLink
            value="Log in"
            styleClass="account-switch__link"
            process="@this"
            action="#{orderAPizzaDialogBean.goToLoginPage()}"
            update="form:pageContent form:messages"
          />
        </div>
      </div>
    </f:validateBean>

    <ftr:Footer>
      <p:commandButton
        id="backButton"
        value="Back"
        icon="pi pi-arrow-left"
        styleClass="button button--ghost"
        process="@this"
        action="#{orderAPizzaDialogBean.goToPreviousPage()}"
        update="form:pageContent form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:tif="jakarta.faces.composite/components/generic/textinputfield"
>



  <div class="login-page" id="loginPage">

    <hdr:Header
      title="Log in"
    />

    <!-- every field is checked as soon as it is left. a wrong password comes back from the server and lands under the password field -->
    <div class="input-grid card narrow centered">
      <tif:TextInputField
        id="userName"
        label="Username"
        value="#{orderAPizzaDialogBean.credentials.userName}"
        autocomplete="username"
        styleClass="input-grid__item input-grid__item--wide"
      />
      <tif:TextInputField
        id="password"
        label="Password"
        type="password"
        value="#{orderAPizzaDialogBean.credentials.password}"
        autocomplete="current-password"
        styleClass="input-grid__item input-grid__item--wide"
      />

      <p:commandButton
        id="loginButton"
        value="Log in"
        icon="pi pi-sign-in"
        styleClass="button button--primary form-submit"
        action="#{orderAPizzaDialogBean.login()}"
        update="form:pageContent form:messages"
      />

      <div class="account-switch input-grid__item input-grid__item--wide">
        <span class="account-switch__text">No account yet?</span>
        <p:commandLink
          value="Sign up"
          styleClass="account-switch__link"
          process="@this"
          action="#{orderAPizzaDialogBean.goToSignupPage()}"
          update="form:pageContent form:messages"
        />
      </div>
    </div>

    <ftr:Footer>
      <p:commandButton
        id="backButton"
        value="Back"
        icon="pi pi-arrow-left"
        styleClass="button button--ghost"
        process="@this"
        action="#{orderAPizzaDialogBean.goToDetailsInputPage()}"
        update="form:pageContent form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

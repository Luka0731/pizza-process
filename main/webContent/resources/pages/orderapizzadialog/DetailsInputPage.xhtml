<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:tif="jakarta.faces.composite/components/generic/textinputfield"
  xmlns:prf="jakarta.faces.composite/components/domain/profile"
>



  <div class="details-input-page" id="detailsInputPage">

    <hdr:Header
      title="Where should it go?"
    >
      <f:facet name="profile">
        <prf:Profile
          showAccountLinks="true"
          loginAction="#{orderAPizzaDialogBean.goToLoginPage()}"
          signupAction="#{orderAPizzaDialogBean.goToSignupPage()}"
          logoutAction="#{orderAPizzaDialogBean.logout()}"
          update="form:pageContent form:messages"
        />
      </f:facet>
    </hdr:Header>

    <div class="input-grid card">
      <tif:TextInputField
        id="fullName"
        label="Full name"
        value="#{orderAPizzaDialogBean.customerProfile.fullName}"
        placeholder="Mustafa Tomman"
        autocomplete="name"
        styleClass="input-grid__item input-grid__item--wide"
      />
      <tif:TextInputField
        id="email"
        label="E-mail"
        type="email"
        value="#{orderAPizzaDialogBean.customerProfile.email}"
        placeholder="you@example.ch"
        autocomplete="email"
        styleClass="input-grid__item"
      />
      <tif:TextInputField
        id="phone"
        label="Phone"
        type="tel"
        value="#{orderAPizzaDialogBean.customerProfile.phone}"
        placeholder="+41 79 000 00 00"
        autocomplete="tel"
        styleClass="input-grid__item"
      />
      <tif:TextInputField
        id="street"
        label="Street and house number"
        value="#{orderAPizzaDialogBean.customerProfile.street}"
        placeholder="Bahnhofstrasse 12"
        autocomplete="address-line1"
        styleClass="input-grid__item input-grid__item--wide"
      />
      <tif:TextInputField
        id="postalCode"
        label="Postal code"
        value="#{orderAPizzaDialogBean.customerProfile.postalCode}"
        placeholder="8005"
        autocomplete="postal-code"
        styleClass="input-grid__item input-grid__item--small"
      />
      <tif:TextInputField
        id="city"
        label="City"
        value="#{orderAPizzaDialogBean.customerProfile.city}"
        placeholder="Zurich"
        autocomplete="address-level2"
        styleClass="input-grid__item"
      />
    </div>

    <ftr:Footer>
      <f:facet name="summary">
        <span class="app-footer__label">Total</span>
        <span class="app-footer__value">
          <h:outputText value="#{orderAPizzaDialogBean.order.totalPrice}">
            <f:convertNumber type="currency" currencySymbol="CHF " minFractionDigits="2"/>
          </h:outputText>
        </span>
      </f:facet>
      <p:commandButton
        id="nextButton"
        value="Next"
        icon="pi pi-arrow-right"
        iconPos="right"
        styleClass="button button--primary"
        action="#{orderAPizzaDialogBean.goToDetailsConfirmationPage()}"
        update="form:pageContent form:messages"
      />
      <p:defaultCommand target="nextButton"/>
    </ftr:Footer>

  </div>
</ui:composition>

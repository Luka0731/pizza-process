<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:odc="jakarta.faces.composite/components/domain/ordercard"
  xmlns:op="jakarta.faces.composite/components/domain/orderprogress"
>



  <div class="ask-page" id="askPage">

    <hdr:Header
      title="Where is my pizza?"
    />

    <div class="split">
      <div class="split__main">
        <div class="card">
          <div class="card__head">
            <h2 class="card__title">Where it is</h2>
          </div>
          <op:OrderProgress order="#{askForThePizzaDialogBean.order}"/>
          <dl class="data-list">
            <div class="data-list__row">
              <dt class="data-list__label">Order number</dt>
              <dd class="data-list__value"><h:outputText value="#{askForThePizzaDialogBean.order.id}"/></dd>
            </div>
          </dl>
        </div>

        <h:panelGroup layout="block" styleClass="card" rendered="#{not askForThePizzaDialogBean.pizzaHere}">
          <div class="card__head">
            <p:outputLabel for="question" value="Ask the pizzeria" styleClass="card__title"/>
            <h:outputText styleClass="card__hint" value="#{askForThePizzaDialogBean.questionAsked ? 'sent. for more questions, please write us an e-mail' : 'we answer by e-mail, one question per order'}"/>
          </div>
          <p:inputTextarea
            id="question"
            value="#{askForThePizzaDialogBean.question}"
            rows="4"
            maxlength="500"
            autoResize="false"
            placeholder="Where is my pizza?"
            disabled="#{askForThePizzaDialogBean.questionAsked}"
            styleClass="textarea"
          />
          <!-- sending the question gives the clerk the task "calm customer down", the dialog stays open.
               one question per order (Order.questionAsked), after that the form is disabled -->
          <p:commandButton
            id="askButton"
            value="#{askForThePizzaDialogBean.questionAsked ? 'Question sent' : 'Send question'}"
            icon="#{askForThePizzaDialogBean.questionAsked ? 'pi pi-check' : 'pi pi-send'}"
            disabled="#{askForThePizzaDialogBean.questionAsked}"
            styleClass="button button--primary form-submit"
            process="@this question"
            action="#{askForThePizzaDialogBean.ask()}"
            update="form:pageContent form:messages"
          />
        </h:panelGroup>
      </div>
      <div class="split__side">
        <odc:OrderCard order="#{askForThePizzaDialogBean.order}"/>
      </div>
    </div>

    <!-- leaving without a question just closes the dialog -->
    <ftr:Footer>
      <p:commandButton
        id="leaveButton"
        value="Leave"
        icon="pi pi-sign-out"
        styleClass="button button--ghost"
        process="@this"
        action="#{askForThePizzaDialogBean.close()}"
      />
    </ftr:Footer>

  </div>
</ui:composition>

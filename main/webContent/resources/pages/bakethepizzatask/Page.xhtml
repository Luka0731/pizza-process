<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:prf="jakarta.faces.composite/components/domain/profile"
  xmlns:odc="jakarta.faces.composite/components/domain/ordercard"
>
  <h:outputStylesheet name="pages/bakethepizzatask/Page.css"/>



  <div class="bake-page" id="bakePage">

    <hdr:Header
      title="Bake the pizza"
      subtitle="Bake everything on this order, then send it off to the delivery"
      showCart="false"
    >
      <f:facet name="actions">
        <prf:Profile showAccountLinks="false"/>
      </f:facet>
    </hdr:Header>

    <div class="bake-page__cards">
      <odc:OrderCard
        order="#{bakeThePizzaTaskBean.order}"
        title="To bake"
        styleClass="bake-page__order"
      />
    </div>

    <!-- closing the dialog finishes the user task, the process continues with the delivery -->
    <ftr:Footer styleClass="bake-page__footer">
      <p:commandButton
        id="readyButton"
        value="Pizza is ready"
        icon="pi pi-check"
        styleClass="button button--primary"
        process="@this"
        action="#{bakeThePizzaTaskBean.close()}"
        update="form:pageContent form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

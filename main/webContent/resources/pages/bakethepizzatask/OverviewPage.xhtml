<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:prf="jakarta.faces.composite/components/domain/profile"
  xmlns:cic="jakarta.faces.composite/components/domain/itemcard"
>
  <h:outputStylesheet name="resources/pages/bakethepizzatask/OverviewPage.css"/>



  <div class="bake-page" id="bakePage">

    <hdr:Header
      title="Bake the pizza"
      subtitle="Bake everything on this order, then send it off to the delivery"
    >
      <f:facet name="actions">
        <prf:Profile/>
      </f:facet>
    </hdr:Header>

    <div class="card">
      <div class="card__head">
        <h2 class="card__title">To bake</h2>
        <span class="card__hint">Click a pizza to see its recipe</span>
      </div>

      <div class="stack">
        <ui:repeat value="#{bakeThePizzaTaskBean.order.items}" var="item" varStatus="loop">
          <p:commandLink
            styleClass="bake-page__item"
            title="Show the recipe"
            process="@this"
            action="#{bakeThePizzaTaskBean.goToRecipePage(item.pizza)}"
            update="form:pageContent form:messages"
          >
            <cic:ItemCard item="#{item}" index="#{loop.index}" removable="false"/>
          </p:commandLink>
        </ui:repeat>
      </div>
    </div>

    <!-- closing the dialog finishes the user task, the process continues with the delivery -->
    <ftr:Footer>
      <p:commandButton
        id="readyButton"
        value="Pizza is ready"
        icon="pi pi-check"
        styleClass="button button--primary"
        process="@this"
        action="#{bakeThePizzaTaskBean.close()}"
        update="form:pageContent form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:dtc="jakarta.faces.composite/components/domain/detailscard"
  xmlns:odc="jakarta.faces.composite/components/domain/ordercard"
>
  <h:outputStylesheet name="resources/pages/calmcustomerdowntask/CalmCustomerDownPage.css"/>



  <div class="calm-page" id="calmPage">

    <hdr:Header
      title="Calm the customer down"
    />

    <div class="split">
      <div class="split__main">
        <blockquote class="calm-page__question">
          <h:outputText value="#{calmCustomerDownTaskBean.customerQuestion}" styleClass="calm-page__question-text"/>
          <footer class="calm-page__question-from">
            <h:outputText value="#{calmCustomerDownTaskBean.order.customerProfile.fullName}"/>
          </footer>
        </blockquote>

        <div class="card">
          <div class="card__head">
            <p:outputLabel for="answer" value="Your answer" styleClass="card__title"/>
            <span class="card__hint">goes to #{calmCustomerDownTaskBean.order.customerProfile.email}</span>
          </div>
          <p:inputTextarea
            id="answer"
            value="#{calmCustomerDownTaskBean.answer}"
            rows="6"
            maxlength="2000"
            autoResize="false"
            placeholder="Sorry for the wait, your pizza ..."
            styleClass="textarea"
          />
          <!-- these lines get added to the mail by themselves, the clerk does not have to type them -->
          <div class="calm-page__mail-footer">
            <span class="calm-page__mail-footer-hint">Added underneath automatically</span>
            <pre class="calm-page__mail-footer-text"><h:outputText value="#{calmCustomerDownTaskBean.automaticFooter}"/></pre>
          </div>
        </div>
      </div>
      <div class="split__side">
        <dtc:DetailsCard customerProfile="#{calmCustomerDownTaskBean.order.customerProfile}" editable="false"/>
        <odc:OrderCard order="#{calmCustomerDownTaskBean.order}" title="The order"/>
      </div>
    </div>

    <!-- sending the answer finishes the user task -->
    <ftr:Footer>
      <p:commandButton
        id="sendButton"
        value="Send answer"
        icon="pi pi-send"
        styleClass="button button--primary"
        process="@form"
        action="#{calmCustomerDownTaskBean.close()}"
        update="form:pageContent form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

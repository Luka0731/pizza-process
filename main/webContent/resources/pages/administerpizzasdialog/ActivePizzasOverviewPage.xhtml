<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:pr="jakarta.faces.composite/components/domain/pizzarow"
  xmlns:fb="jakarta.faces.composite/components/generic/filterbar"
>



  <div class="pizza-list-page" id="pizzaListPage">

    <hdr:Header
      title="Activated Pizzas"
    />

    <fb:FilterBar
      filter="#{administerPizzasDialogBean.filter}"
      searchAction="#{administerPizzasDialogBean.search()}"
      resetAction="#{administerPizzasDialogBean.clearFilter()}"
      update="form:pageContent form:messages"
    >
      <div class="filter-bar__item filter-bar__item--wide">
        <p:outputLabel for="name" value="Search" styleClass="filter-bar__label"/>
        <p:inputText id="name" value="#{administerPizzasDialogBean.filter.name}" placeholder="e.g. Margherita" maxlength="31" autocomplete="off" styleClass="filter-bar__input"/>
      </div>
    </fb:FilterBar>

    <!-- loaded state -->
    <div class="stack">
      <ui:repeat value="#{administerPizzasDialogBean.activePizzas}" var="pizza" varStatus="loop">
        <pr:PizzaRow pizza="#{pizza}" index="#{loop.index}" sizes="#{administerPizzasDialogBean.possiblePizzaSizes}">
          <f:facet name="actions">
            <p:commandButton
              icon="pi pi-pencil"
              title="Edit"
              styleClass="button button--ghost"
              process="@this"
              action="#{administerPizzasDialogBean.startEditPizzaForm(pizza)}"
              update="form:pageContent form:messages"
            />
            <p:commandButton
              icon="pi pi-eye-slash"
              title="Deactivate"
              styleClass="button button--outline"
              process="@this"
              rendered="#{authorizationBean.can('CHANGE_IMPORTANT_PIZZA_DATA_PERMISSON')}"
              action="#{administerPizzasDialogBean.deactivate(pizza)}"
              update="form:pageContent form:messages"
            />
          </f:facet>
        </pr:PizzaRow>
      </ui:repeat>
    </div>

    <!-- empty state -->
    <h:panelGroup layout="block" styleClass="empty-state" rendered="#{empty administerPizzasDialogBean.activePizzas}">
      <i class="pi pi-inbox empty-state__icon"></i>
      <span class="empty-state__text">No pizza is on the menu. Put one back from the deactivated pizzas.</span>
    </h:panelGroup>

    <ftr:Footer>
      <f:facet name="summary">
        <span class="footer__label">On the menu</span>
        <span class="footer__value">
          <h:outputText value="#{administerPizzasDialogBean.activePizzaCount} pizza(s)"/>
        </span>
      </f:facet>
      <!-- new pizzas always start deactivated, so "New pizza" lives on the deactivated page where the new pizza shows up -->
      <p:commandButton
        id="deactivatedButton"
        value="Deactivated pizzas"
        icon="pi pi-eye-slash"
        styleClass="button button--ghost"
        process="@this"
        action="#{administerPizzasDialogBean.goToDeactivatedPizzasOverviewPage()}"
        update="form:pageContent form:messages"
      />
      <p:commandButton
        id="doneButton"
        value="Done"
        icon="pi pi-check"
        styleClass="button button--ghost"
        process="@this"
        action="#{administerPizzasDialogBean.close()}"
      />
    </ftr:Footer>

  </div>
</ui:composition>

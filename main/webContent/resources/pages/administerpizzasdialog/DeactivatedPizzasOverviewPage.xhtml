<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:pr="jakarta.faces.composite/components/domain/pizzarow"
  xmlns:fb="jakarta.faces.composite/components/generic/filterbar"
>



  <div class="pizza-list-page" id="deactivatedPizzasPage">

    <hdr:Header
      title="Deactivated Pizzas"
    />

    <fb:FilterBar
      filter="#{administerPizzasDialogBean.filter}"
      searchAction="#{administerPizzasDialogBean.search()}"
      resetAction="#{administerPizzasDialogBean.clearFilter()}"
      update="form:pageContent form:messages"
    >
      <div class="filter-bar__item filter-bar__item--wide">
        <p:outputLabel for="name" value="Search" styleClass="filter-bar__label"/>
        <p:inputText id="name" value="#{administerPizzasDialogBean.filter.name}" placeholder="e.g. Margherita" maxlength="31" autocomplete="off" styleClass="filter-bar__input"/>
      </div>
    </fb:FilterBar>

    <!-- loaded state -->
    <div class="stack">
      <!-- adding is not navigation, so it is not in the footer. it sits on top of the list, where the new pizza shows up -->
      <p:commandLink
        id="addButton"
        styleClass="add-row"
        process="@this"
        action="#{administerPizzasDialogBean.startNewPizzaForm()}"
        update="form:pageContent form:messages"
      >
        <i class="pi pi-plus add-row__icon"></i>
        <span class="add-row__text">New pizza</span>
      </p:commandLink>
      <ui:repeat value="#{administerPizzasDialogBean.deactivatedPizzas}" var="pizza" varStatus="loop">
        <pr:PizzaRow pizza="#{pizza}" index="#{loop.index}" sizes="#{administerPizzasDialogBean.possiblePizzaSizes}" muted="true">
          <f:facet name="actions">
            <p:commandButton
              icon="pi pi-pencil"
              title="Edit"
              styleClass="button button--ghost"
              process="@this"
              action="#{administerPizzasDialogBean.startEditPizzaForm(pizza)}"
              update="form:pageContent form:messages"
            />
            <p:commandButton
              icon="pi pi-eye"
              title="Put on the menu"
              styleClass="button button--outline"
              process="@this"
              rendered="#{authorizationBean.can('CHANGE_IMPORTANT_PIZZA_DATA_PERMISSON')}"
              action="#{administerPizzasDialogBean.activate(pizza)}"
              update="form:pageContent form:messages"
            />
            <p:commandButton
              icon="pi pi-trash"
              title="Delete for good"
              styleClass="button button--danger"
              process="@this"
              rendered="#{authorizationBean.can('CHANGE_IMPORTANT_PIZZA_DATA_PERMISSON')}"
              action="#{administerPizzasDialogBean.delete(pizza)}"
              update="form:pageContent form:messages"
            >
              <p:confirm header="Delete this pizza?" message="'#{pizza.name}' disappears from the administration for good. Orders that already contain it keep working." icon="pi pi-exclamation-triangle"/>
            </p:commandButton>
          </f:facet>
        </pr:PizzaRow>
      </ui:repeat>
    </div>

    <!-- empty state -->
    <h:panelGroup layout="block" styleClass="empty-state" rendered="#{empty administerPizzasDialogBean.deactivatedPizzas}">
      <i class="pi pi-check-circle empty-state__icon"></i>
      <span class="empty-state__text">Nothing is deactivated. New pizzas you add show up here first.</span>
    </h:panelGroup>

    <!-- confirm dialog -->
    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="420">
      <p:commandButton value="Cancel" type="button" styleClass="button button--ghost ui-confirmdialog-no"/>
      <p:commandButton value="Delete" type="button" icon="pi pi-trash" styleClass="button button--danger ui-confirmdialog-yes"/>
    </p:confirmDialog>

    <ftr:Footer>
      <f:facet name="summary">
        <span class="footer__label">Deactivated</span>
        <span class="footer__value">
          <h:outputText value="#{administerPizzasDialogBean.deactivatedPizzaCount} pizza(s)"/>
        </span>
      </f:facet>
      <p:commandButton
        id="backButton"
        value="Activated pizzas"
        icon="pi pi-arrow-left"
        styleClass="button button--ghost"
        process="@this"
        action="#{administerPizzasDialogBean.goToActivePizzasOverviewPage()}"
        update="form:pageContent form:messages"
      />
      <p:commandButton
        id="doneButton"
        value="Done"
        icon="pi pi-check"
        styleClass="button button--ghost"
        process="@this"
        action="#{administerPizzasDialogBean.close()}"
      />
    </ftr:Footer>

  </div>
</ui:composition>

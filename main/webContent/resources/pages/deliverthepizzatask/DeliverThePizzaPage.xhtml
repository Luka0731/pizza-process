<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:dtc="jakarta.faces.composite/components/domain/detailscard"
  xmlns:odc="jakarta.faces.composite/components/domain/ordercard"
>



  <div class="deliver-the-pizza-page" id="deliverThePizzaPage">

    <hdr:Header title="Deliver the pizza"/>

    <div class="split">
      <div class="split__main">
        <dtc:DetailsCard customerProfile="#{deliverThePizzaTaskBean.order.customerProfile}" editable="false"/>
      </div>
      <div class="split__side">
        <odc:OrderCard order="#{deliverThePizzaTaskBean.order}" title="In the bag" showPrices="false"/>
      </div>
    </div>

    <ftr:Footer>
      <p:commandButton
        id="deliveredButton"
        value="Pizza delivered"
        icon="pi pi-check"
        styleClass="button button--primary"
        process="@this"
        action="#{deliverThePizzaTaskBean.close()}"
        update="form:pageContent form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

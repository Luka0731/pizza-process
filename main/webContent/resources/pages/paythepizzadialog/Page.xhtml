<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
  xmlns:hdr="jakarta.faces.composite/components/generic/header"
  xmlns:ftr="jakarta.faces.composite/components/generic/footer"
  xmlns:rcp="jakarta.faces.composite/components/domain/receipt"
  xmlns:prf="jakarta.faces.composite/components/domain/profile"
  xmlns:dtc="jakarta.faces.composite/components/domain/detailscard"
  xmlns:odc="jakarta.faces.composite/components/domain/ordercard"
  xmlns:op="jakarta.faces.composite/components/domain/orderprogress"
>



  <div class="pay-page" id="payPage">

    <hdr:Header
      title="#{payThePizzaDialogBean.waiting ? 'Your pizza is coming' : 'Your pizza is here!'}"
      subtitle="#{payThePizzaDialogBean.statusText}"
    >
      <f:facet name="actions">
        <prf:Profile/>
      </f:facet>
    </hdr:Header>

    <!-- while waiting, the page asks every 10 seconds if the driver delivered the pizza. global="false" keeps the loading bar quiet -->
    <p:poll
      interval="10"
      global="false"
      listener="#{payThePizzaDialogBean.refresh()}"
      process="@this"
      update="form:pageContent form:messages"
      rendered="#{payThePizzaDialogBean.waiting}"
    />

    <div class="split">
      <div class="split__main">
        <div class="card">
          <div class="card__head">
            <h2 class="card__title">Where it is</h2>
            <h:panelGroup styleClass="card__hint" rendered="#{payThePizzaDialogBean.waiting}">updates by itself</h:panelGroup>
          </div>
          <op:OrderProgress order="#{payThePizzaDialogBean.order}"/>
        </div>
        <odc:OrderCard order="#{payThePizzaDialogBean.order}"/>
      </div>
      <div class="split__side">
        <rcp:Receipt order="#{payThePizzaDialogBean.order}" totalLabel="#{payThePizzaDialogBean.paid ? 'Paid' : 'To pay'}"/>
      </div>
    </div>

    <!-- paying closes the dialog, the process goes on to "eat the pizza" -->
    <ftr:Footer>
      <p:commandButton
        id="refreshButton"
        value="Refresh"
        icon="pi pi-refresh"
        styleClass="button button--ghost"
        process="@this"
        rendered="#{payThePizzaDialogBean.waiting}"
        action="#{payThePizzaDialogBean.refresh()}"
        update="form:pageContent form:messages"
      />
      <p:commandButton
        id="payButton"
        value="#{payThePizzaDialogBean.paid ? 'Continue' : 'Pay now'}"
        icon="#{payThePizzaDialogBean.paid ? 'pi pi-arrow-right' : 'pi pi-credit-card'}"
        styleClass="button button--primary"
        process="@this"
        rendered="#{not payThePizzaDialogBean.waiting}"
        action="#{payThePizzaDialogBean.close()}"
        update="form:pageContent form:messages"
      />
    </ftr:Footer>

  </div>
</ui:composition>

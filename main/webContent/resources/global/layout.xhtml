<!DOCTYPE html>

<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:p="primefaces"
>

<!--
  every dialog uses this template and only sets three things:
  - ui:param "page":   the page to show, e.g. #{exampleDialogBean.router()}
  - ui:define "title": the name of the dialog, shown in the tab and the top bar
  - ui:define "info":  what the user does in this dialog, opens with the (i) next to the name
-->

  <h:head>
    <!-- meta -->
    <f:attribute name="primefaces.THEME" value="#{ivyFreyaTheme.theme}"/>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title><ui:insert name="title">Pizza Process</ui:insert></title>
    <link rel="shortcut icon" href="#{resource['ivy-branding:favicon']}"/>
    <!-- ivy theme -->
    <h:outputScript name="js/layout.js" library="#{ivyFreyaTheme.library}"/>
    <h:outputStylesheet name="#{ivyFreyaTheme.layout}" library="#{ivyFreyaTheme.library}"/>
    <h:outputStylesheet name="primeflex-3.min.css" library="primeflex"/>
    <h:outputStylesheet name="custom.css" library="ivy-branding"/>
    <!-- fonts, without internet the system fonts take over -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap"/>
    <!-- pizza process theme -->
    <h:outputStylesheet name="resources/global/style.css"/>
    <h:outputStylesheet name="resources/global/primefaces.css"/>
    <h:outputScript name="resources/global/logic.js" target="head"/>
    <h:outputScript name="resources/global/effects.js" target="head"/>
  </h:head>



  <h:body class="body-hd #{ivyFreyaTheme.mode} pizza-process">
    <ui:include src="/ivy-form/layouts/includes/progress-loader.xhtml"/>

    <!-- brand bar, the logo hides itself if the file does not exist (see docs/LOGO.txt) -->
    <header class="brand">
      <img class="brand__logo" src="#{resource['resources/assets/images/logo.jpg']}" alt="" onerror="this.remove()"/>
      <span class="brand__name">Babajabuka's Pizzeria</span>
      <span class="brand__dialog">
        <ui:insert name="title"/>
        <!-- the browser opens and closes the popover by itself, no script needed -->
        <button type="button" class="brand__info" popovertarget="dialogInfo" title="What happens here?" aria-label="What happens here?">
          <i class="pi pi-info"></i>
        </button>
      </span>
      <div id="dialogInfo" class="dialog-info" popover="auto">
        <strong class="dialog-info__title"><ui:insert name="title"/></strong>
        <p class="dialog-info__text"><ui:insert name="info"/></p>
      </div>
    </header>

    <main id="content" class="frame">
      <h:form id="form">
        <p:growl id="messages" showDetail="true" life="4000"/>

        <p:outputPanel id="pageContent" layout="block" styleClass="dialog-content">
          <ui:include src="#{page}"/>
        </p:outputPanel>
      </h:form>
    </main>

    <!-- server error page -->
    <ui:insert name="exception">
      <ui:include src="/ivy-form/layouts/includes/exception.xhtml"/>
    </ui:insert>
  </h:body>



</html>

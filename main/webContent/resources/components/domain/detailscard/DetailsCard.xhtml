<ui:component
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:cc="jakarta.faces.composite"
  xmlns:p="primefaces"
>



  <cc:interface>
    <cc:attribute name="customerProfile" type="ch.frox.pizzaprocess.main.java.domain.customerprofile.CustomerProfile" required="true" shortDescription="the details to show"/>
    <cc:attribute name="editAction" method-signature="void action()" shortDescription="leads back to where the details can be changed"/>
    <cc:attribute name="editable" type="java.lang.Boolean" default="true"/>
    <cc:attribute name="update" type="java.lang.String" default="@form"/>
    <cc:attribute name="styleClass" type="java.lang.String" default=""/>
  </cc:interface>



  <cc:implementation>
    <h:outputStylesheet name="resources/components/domain/detailscard/DetailsCard.css"/>
    <div id="#{cc.clientId}" class="details-card card #{cc.attrs.styleClass}">



      <div class="card__head">
        <h2 class="card__title">Delivery address</h2>
        <p:commandLink
          value="Edit"
          styleClass="card__link"
          process="@this"
          rendered="#{cc.attrs.editable}"
          action="#{cc.attrs.editAction}"
          update="#{cc.attrs.update}"
        />
      </div>

      <dl class="data-list">
        <div class="data-list__row">
          <dt class="data-list__label">Name</dt>
          <dd class="data-list__value"><h:outputText value="#{cc.attrs.customerProfile.fullName}"/></dd>
        </div>
        <div class="data-list__row">
          <dt class="data-list__label">E-mail</dt>
          <dd class="data-list__value"><h:outputText value="#{cc.attrs.customerProfile.email}"/></dd>
        </div>
        <div class="data-list__row">
          <dt class="data-list__label">Phone</dt>
          <dd class="data-list__value"><h:outputText value="#{cc.attrs.customerProfile.phone}"/></dd>
        </div>
        <div class="data-list__row">
          <dt class="data-list__label">Address</dt>
          <dd class="data-list__value">
            <h:outputText value="#{cc.attrs.customerProfile.street}"/>
            <br/>
            <h:outputText value="#{cc.attrs.customerProfile.postalCode} #{cc.attrs.customerProfile.city}"/>
          </dd>
        </div>
      </dl>



    </div>
  </cc:implementation>
</ui:component>

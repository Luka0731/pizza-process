<ui:component
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:cc="jakarta.faces.composite"
  xmlns:prf="jakarta.faces.composite/components/domain/profile"
>



  <cc:interface>
    <cc:attribute name="title" type="java.lang.String" required="true"/>
    <cc:attribute name="showProfile" type="java.lang.Boolean" default="true" shortDescription="shows who is logged in on the right"/>
    <cc:attribute name="styleClass" type="java.lang.String" default=""/>
    <cc:facet name="actions" shortDescription="extra content on the right. what a dialog is for goes into the info of the dialog, not here"/>
    <cc:facet name="profile" shortDescription="replaces the default profile, e.g. one with log in and sign up links"/>
  </cc:interface>



  <cc:implementation>
    <h:outputStylesheet name="resources/components/generic/header/Header.css"/>
    <div id="#{cc.clientId}" class="app-header #{cc.attrs.styleClass}">



      <div class="app-header__text">
        <h1 class="app-header__title">
          <h:outputText value="#{cc.attrs.title}"/>
        </h1>
      </div>

      <div class="app-header__actions">
        <cc:renderFacet name="actions"/>
        <cc:renderFacet name="profile"/>
        <prf:Profile rendered="#{cc.attrs.showProfile and empty cc.facets.profile}"/>
      </div>

      <div class="app-header__strip" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>



    </div>
  </cc:implementation>
</ui:component>

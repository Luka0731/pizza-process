<ui:component
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:cc="jakarta.faces.composite"
>



  <cc:interface>
    <cc:attribute name="styleClass" type="java.lang.String" default=""/>
    <cc:facet name="summary" shortDescription="left side, use footer__label and footer__value inside"/>
  </cc:interface>



  <cc:implementation>
    <h:outputStylesheet name="resources/components/generic/footer/Footer.css"/>
    <div id="#{cc.clientId}" class="app-footer #{cc.attrs.styleClass}">



      <h:panelGroup layout="block" styleClass="app-footer__summary" rendered="#{not empty cc.facets.summary}">
        <cc:renderFacet name="summary"/>
      </h:panelGroup>

      <div class="app-footer__actions">
        <cc:insertChildren/>
      </div>



    </div>
  </cc:implementation>
</ui:component>
